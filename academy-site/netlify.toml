[build]
  # Netlify runs monorepo package builds from the repository root when the package directory is set,
  # so target the Academy app explicitly instead of the root Next.js app.
  command = "npm --prefix academy-site run build"
  # The OpenNext adapter needs a real build output directory instead of defaulting to the package
  # directory itself, which Netlify treats as an invalid publish target for Next.js.
  publish = "academy-site/.next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  # The Academy site is its own Next.js deployment and should use Netlify's Next runtime directly.
  package = "@netlify/plugin-nextjs"
