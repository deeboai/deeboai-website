[build]
  command = "npm run build"

[build.environment]
  # The project pins Node 22 locally and does not support Node 25+.
  NODE_VERSION = "22"
  # Supabase project URL and anon key are intentionally public client values, so Netlify should not block deploys when they appear in built chunks.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  # Force Netlify's Next.js runtime so the deploy includes the server function and middleware instead of publishing `.next` as a static folder.
  package = "@netlify/plugin-nextjs"

[[redirects]]
  # Production traffic for Academy should leave the main site and land on the standalone Academy deployment.
  from = "/academy"
  to = "https://academy.deeboai.com"
  status = 302
  force = true

[[redirects]]
  # Nested Academy routes should keep their path when the main site forwards them to the Academy subdomain.
  from = "/academy/*"
  to = "https://academy.deeboai.com/:splat"
  status = 302
  force = true
